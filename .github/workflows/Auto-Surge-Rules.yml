# 深巷有喵的「Surge」上游同步规则
# 版本：1.0
# 日期：2026.11.14
# 作者：https://github.com/VeryAtao/Surge

name: Auto-Surge-Rules

# 触发器配置
on:
  schedule:
    # 定时任务：北京时间每天 04:00 执行
    - cron: '0 20 * * *'
  # 允许手动触发
  workflow_dispatch:

# 权限配置
permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest
    
    # 强制所有 JavaScript Actions 使用 Node.js 24
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      # 步骤 1：检出代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 步骤 2：下载、清洗、合并去重、统计并归档
      - name: Download, Merge and Filter Rules
        run: |
          # 创建输出目录及手动规则存储目录
          mkdir -p Rules/Manual
          
          # 获取北京时间
          UPDATE_TIME=$(TZ="Asia/Shanghai" date +"%Y.%m.%d %H:%M:%S")
          
          # 1. 定义标准处理函数 (用于 1对1 的规则同步)
          process_rule() {
            local source_url=$1
            local target_name=$2
            local display_name=$3
            
            local target_path="Rules/$target_name"
            local filename_no_ext="${target_name%.*}"
            local manual_file="Rules/Manual/${filename_no_ext}.txt"
            local exclude_file="Rules/Manual/${filename_no_ext}.exclude.txt"
            PROCESSED_RULES+=("$filename_no_ext")
            
            temp_body=$(mktemp)
            
            # A. 合并手动追加规则 (去除尾部多余空行，紧凑输出)
            if [ -f "$manual_file" ]; then
              # 剔除 Windows 回车符，并过滤文件末尾悬挂的空白行
              local clean_manual
              clean_manual=$(awk '
                { sub(/\r$/, "") }
                /^[[:space:]]*$/ { blank = blank $0 "\n"; next }
                { printf "%s%s\n", blank, $0; blank = "" }
              ' "$manual_file")
              
              if [ -n "$clean_manual" ]; then
                echo "# ======= 手动维护规则 ========" >> "$temp_body"
                echo "$clean_manual" >> "$temp_body"
              fi
            fi
            
            # B. 写入上游同步规则 (紧贴手动规则输出)
            echo "# ======= 上游同步规则 ========" >> "$temp_body"
            if [ -f "$exclude_file" ] && [ -s "$exclude_file" ]; then
              curl -sL "$source_url" | sed 's/\r//g' | grep -v '^#' | grep -v '^[[:space:]]*$' | grep -vFf "$exclude_file" >> "$temp_body"
            else
              curl -sL "$source_url" | sed 's/\r//g' | grep -v '^#' | grep -v '^[[:space:]]*$' >> "$temp_body"
            fi
            
            # C. 规则去重（保留注释顺序，去除正文完全重复的行）
            awk '/^#|^[[:space:]]*$/ {print; next} !seen[$0]++' "$temp_body" > "${temp_body}.tmp" && mv "${temp_body}.tmp" "$temp_body"
            
            # D. 统计非注释且非空行的行数
            local rule_count=$(grep -v '^#' "$temp_body" | grep -v '^[[:space:]]*$' | wc -l)
            
            # E. 构造最终文件
            {
              echo "# NAME: $display_name"
              echo "# AUTHOR: VeryAtao"
              echo "# REPO: https://github.com/VeryAtao/Surge"
              echo "# UPDATED: $UPDATE_TIME"
              echo "# TOTAL: $rule_count"
              echo ""
              cat "$temp_body"
            } > "$target_path"

            rm -f "$temp_body"
          }
          
          # --- 第一部分：常规规则同步 ---
          # 推送
          URL_PROXY="https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/loon/apns.list"
          process_rule "$URL_PROXY" "AppleAPns.list" "阿涛Atao的「AppleAPns」规则"
          
          # Loyalsoldier 仓库
          URL_PROXY="https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/cncidr.txt"
          process_rule "$URL_PROXY" "ChinaCIDR.list" "阿涛Atao的「ChinaCIDR」规则"

          # Sukka 仓库
          URL_PROXY="https://ruleset.skk.moe/List/ip/telegram.conf"
          process_rule "$URL_PROXY" "Telegram.list" "阿涛Atao的「Telegram」规则"
          
          # EAlyce 仓库
          URL_PROXY="https://raw.githubusercontent.com/EAlyce/conf/refs/heads/main/Rule/OpenAI.list"
          process_rule "$URL_PROXY" "AIGC.list" "阿涛Atao的「AIGC」规则"

          # Virgil Clyne 仓库
          URL_PROXY="https://raw.githubusercontent.com/VirgilClyne/GetSomeFries/main/ruleset/ASN.China.list"
          process_rule "$URL_PROXY" "ChinaASN.list" "阿涛Atao的「ChinaASN」规则"

          URL_PROXY="https://raw.githubusercontent.com/VirgilClyne/GetSomeFries/main/ruleset/ASN.Telegram.list"
          process_rule "$URL_PROXY" "TelegramASN.list" "阿涛Atao的「TelegramASN」规则"

          # MagicRule 仓库
          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/China_domain-set_beb3d5e7a3bf4d87.list"
          process_rule "$URL_PROXY" "China.list" "阿涛Atao的「China」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Apple_rules_50be57f093bd1fff.list"
          process_rule "$URL_PROXY" "Apple.list" "阿涛Atao的「Apple」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Google_rules_0804a8c31c599a1e.list"
          process_rule "$URL_PROXY" "Google.list" "阿涛Atao的「Google」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Instagram_rules_7a25b214a1a8549b.list"
          process_rule "$URL_PROXY" "Instagram.list" "阿涛Atao的「Instagram」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Facebook_rules_d466caed63d7550c.list"
          process_rule "$URL_PROXY" "Facebook.list" "阿涛Atao的「Facebook」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Microsoft_rules_7fd3d40967dabeef.list"
          process_rule "$URL_PROXY" "Microsoft.list" "阿涛Atao的「Microsoft」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/YouTube_rules_329ca26de78c21fe.list"
          process_rule "$URL_PROXY" "YouTube.list" "阿涛Atao的「YouTube」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Netflix_rules_56d52a775e1c2240.list"
          process_rule "$URL_PROXY" "Netflix.list" "阿涛Atao的「Netflix」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Disney_rules_2b565301c4989fb0.list"
          process_rule "$URL_PROXY" "Disney.list" "阿涛Atao的「Disney」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Spotify_rules_f68f1309f01d1ad3.list"
          process_rule "$URL_PROXY" "Spotify.list" "阿涛Atao的「Spotify」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/TikTok_rules_f1418ba5f368c034.list"
          process_rule "$URL_PROXY" "TikTok.list" "阿涛Atao的「TikTok」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/BiliBili_rules_2465ea6448cc4fe0.list"
          process_rule "$URL_PROXY" "BiliBili.list" "阿涛Atao的「BiliBili」规则" 

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/ChinaMedia_rules_ea2d0c525bf1fe29.list"
          process_rule "$URL_PROXY" "ChinaMedia.list" "阿涛Atao的「ChinaMedia」规则" 
          
          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/GlobalMedia_rules_cbbbcb6dca56af83.list"
          process_rule "$URL_PROXY" "GlobalMedia.list" "阿涛Atao的「GlobalMedia」规则"  
          
          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Lan_rules_a7096f98ad43c9dc.list"
          process_rule "$URL_PROXY" "LAN.list" "阿涛Atao的「LAN」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/PayPal_rules_e33777c2ef792abd.list"
          process_rule "$URL_PROXY" "PayPal.list" "阿涛Atao的「PayPal」规则"

          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/Whatsapp_rules_a176cc536b62182d.list"
          process_rule "$URL_PROXY" "Whatsapp.list" "阿涛Atao的「Whatsapp」规则"
          
          URL_PROXY="https://magicrule.pages.dev/data/_shared/artifacts/GlobalGame_rules_d8c6da812d5e7f0b.list"
          process_rule "$URL_PROXY" "Game.list" "阿涛Atao的「Game」规则"
          
          # AMEKIN 仓库
          URL_PROXY="https://raw.githubusercontent.com/AMEKIN/Surge/refs/heads/main/rules/Meta.list"
          process_rule "$URL_PROXY" "Meta.list" "阿涛Atao的「Meta」规则"  

          
          # --- 自动扫描未配置上游的手动规则 ---
          echo "开始扫描 Manual 目录中的独立手动规则..."

          shopt -s nullglob

          for manual_file in Rules/Manual/*.txt; do
            filename=$(basename "$manual_file" .txt)

            # 排除文件不作为独立规则
            [[ "$filename" == *.exclude ]] && continue

            # Proxy.txt 由专门的聚合逻辑处理
            [[ "$filename" == "Proxy" ]] && continue

            # 已经配置上游同步的文件不重复生成
            if [[ " ${PROCESSED_RULES[*]} " == *" $filename "* ]]; then
              continue
            fi

            # 空文件不生成
            [ -s "$manual_file" ] || continue

            echo "发现独立手动规则：$filename"

            target_path="Rules/${filename}.list"
            temp_body=$(mktemp)

            # 清理 Windows 回车符
            sed 's/\r$//' "$manual_file" > "$temp_body"

            # 去重，保留注释
            awk '/^#|^[[:space:]]*$/ {print; next} !seen[$0]++' \
              "$temp_body" > "${temp_body}.tmp" \
              && mv "${temp_body}.tmp" "$temp_body"

            # 统计规则数量
            rule_count=$(grep -v '^#' "$temp_body" \
              | grep -v '^[[:space:]]*$' | wc -l)

            # 生成独立规则文件
            {
              echo "# NAME: 阿涛Atao的「${filename}」规则"
              echo "# AUTHOR: VeryAtao"
              echo "# REPO: https://github.com/VeryAtao/Surge"
              echo "# UPDATED: $UPDATE_TIME"
              echo "# TOTAL: $rule_count"
              echo ""
              echo "# ======= 手动维护规则 ========"
              cat "$temp_body"
            } > "$target_path"

            rm -f "$temp_body"

            echo "生成完成：$target_path"
          done

          shopt -u nullglob

          # --- 第二部分：Proxy.list 聚合处理 ---
          PROXY_TARGET="Rules/Proxy.list"
          PROXY_EXCLUDE="Rules/Manual/Proxy.exclude.txt"
          PROXY_MANUAL="Rules/Manual/Proxy.txt"
          proxy_temp=$(mktemp)
          
          # A. Proxy 手动规则
          if [ -f "$PROXY_MANUAL" ]; then
            echo "# ======= 手动维护规则 ========" >> "$proxy_temp"
            cat "$PROXY_MANUAL" >> "$proxy_temp"
            echo "" >> "$proxy_temp"
          fi
          
          # B. Proxy 聚合源
          PROXY_SUBS=(
            "Telegram|https://ruleset.skk.moe/List/ip/telegram.conf"
            "Github|https://magicrule.pages.dev/data/_shared/artifacts/GitHub_rules_02fb1aed89680882.list"
            "Proxy|https://magicrule.pages.dev/data/_shared/artifacts/Global_rules_b5f3bb33d8a4698a.list"
          )
          
          for sub in "${PROXY_SUBS[@]}"; do
            name="${sub%%|*}"
            url="${sub#*|}"
            echo "# ======= $name ========" >> "$proxy_temp"
            if [ -f "$PROXY_EXCLUDE" ] && [ -s "$PROXY_EXCLUDE" ]; then
              curl -sL "$url" | grep -v '^#' | grep -v '^[[:space:]]*$' | grep -vFf "$PROXY_EXCLUDE" >> "$proxy_temp"
            else
              curl -sL "$url" | grep -v '^#' | grep -v '^[[:space:]]*$' >> "$proxy_temp"
            fi
          done
          
          # C. 合并去重
          sed -i 's/\r//g' "$proxy_temp"
          awk '/^#|^[[:space:]]*$/ {print; next} !seen[$0]++' "$proxy_temp" > "${proxy_temp}.tmp" && mv "${proxy_temp}.tmp" "$proxy_temp"

          # D. 统计 Proxy 规则数
          proxy_count=$(grep -v '^#' "$proxy_temp" | grep -v '^[[:space:]]*$' | wc -l)
          
          # E. 写入 Proxy.list 最终文件
          echo "# NAME: 阿涛Atao的「Proxy」规则" > "$PROXY_TARGET"
          echo "# AUTHOR: VeryAtao" >> "$PROXY_TARGET"
          echo "# REPO: https://github.com/VeryAtao/Surge" >> "$PROXY_TARGET"
          echo "# UPDATED: $UPDATE_TIME" >> "$PROXY_TARGET"
          echo "# TOTAL: $proxy_count" >> "$PROXY_TARGET"
          echo "" >> "$PROXY_TARGET"
          cat "$proxy_temp" >> "$PROXY_TARGET"
          rm "$proxy_temp"

      # 步骤 3：Git 提交与推送到远程仓库
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Rules/
          if ! git diff --staged --quiet; then
            COMMIT_TIME=$(TZ="Asia/Shanghai" date +"%Y.%m.%d %H:%M:%S")
            git commit -m "$COMMIT_TIME Update"
            git push
          fi
